<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Element selector / ID selector -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Class selector -->
    <p class="description">
        Xin chào! Tôi là Khải Nguyễn, một người yêu thích công nghệ và đang học lập trình web.
    </p>

    <!-- List với class selector -->
    <h2 class="section-title">Sở thích của tôi</h2>
    <ul class="hobby-list">
        <li class="hobby-item">Đọc sách công nghệ</li>
        <li class="hobby-item">Lập trình web</li>
        <li class="hobby-item">Chơi thể thao</li>
    </ul>

    <!-- Button với Pseudo-class hover -->
    <div class="button-container">
        <button id="btn-click">Nhấn vào đây</button>
    </div>

</body>
</html>
